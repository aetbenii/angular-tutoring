# Configurazione Apache per Sviluppo con Reverse Proxy
# Questa configurazione fa da proxy alle richieste verso il server di sviluppo Angular 
# simulando contemporaneamente l'ambiente di produzione

# ServerName globale per sopprimere gli avvisi di Apache
# È necessario definire un ServerName globale per evitare che Apache generi warning
# durante l'avvio quando non riesce a determinare automaticamente il nome del server.
# Questo migliora la stabilità e riduce i messaggi di errore nei log.
ServerName local-desk.services.siag.it

# VirtualHost per il traffico HTTP sulla porta 80
# Questo VirtualHost gestisce tutte le richieste HTTP non sicure e le reindirizza automaticamente a HTTPS
# È una pratica di sicurezza essenziale per garantire che tutti i dati siano trasmessi in modo crittografato
<VirtualHost *:80>
    # Nome del server per questo VirtualHost specifico
    # Deve corrispondere al nome di dominio utilizzato per accedere all'applicazione
    # Permette ad Apache di instradare correttamente le richieste quando ci sono più VirtualHost
    ServerName local-desk.services.siag.it
    
    # Reindirizzamento forzato da HTTP a HTTPS per garantire la sicurezza
    # RewriteEngine attiva il motore di riscrittura URL di Apache, necessario per elaborare le regole di reindirizzamento
    RewriteEngine On
    
    # RewriteCond verifica se la connessione NON è HTTPS (HTTPS = off)
    # Questa condizione è necessaria per evitare loop infiniti di reindirizzamento
    # e per applicare la regola solo quando effettivamente necessario
    RewriteCond %{HTTPS} off
    
    # RewriteRule effettua il reindirizzamento permanente (301) da HTTP a HTTPS
    # ^(.*)$ cattura l'intera URL richiesta
    # https://%{HTTP_HOST}$1 ricostruisce l'URL usando HTTPS, mantenendo host e path originali
    # [R=301,L] specifica: R=301 (redirect permanente), L (ultima regola da processare)
    # Il redirect 301 è importante per SEO e indica ai browser di cachare il reindirizzamento
    RewriteRule ^(.*)$ https://%{HTTP_HOST}$1 [R=301,L]
</VirtualHost>


# Modalità di simulazione produzione (opzionale)
# Questa configurazione serve l'applicazione Angular compilata dalla cartella dist
# Simula l'ambiente di produzione per testare l'applicazione come se fosse deployata
<VirtualHost *:8443>
    # Nome del server per questo VirtualHost HTTPS
    # Deve corrispondere al certificato SSL configurato per evitare errori di validazione
    ServerName local-desk.services.siag.it
    
    # DocumentRoot specifica la directory radice da cui Apache serve i file statici
    # Punta alla cartella browser generata da Angular build, che contiene tutti i file ottimizzati
    # per la produzione (HTML, CSS, JS minificati e ottimizzati)
    DocumentRoot /var/www/hr-seats-angular/seat-management/browser
    
    # Configurazione SSL per abilitare HTTPS
    # SSLEngine attiva il modulo SSL per questo VirtualHost, essenziale per la crittografia
    # del traffico e per proteggere i dati sensibili in transito
    SSLEngine on
    
    # SSLCertificateFile specifica il percorso del certificato SSL pubblico
    # Questo file contiene la chiave pubblica utilizzata per crittografare i dati
    # e deve essere firmato da una CA (Certificate Authority) o essere self-signed per lo sviluppo
    SSLCertificateFile /etc/ssl/certs/local-desk.services.siag.it.crt
    
    # SSLCertificateKeyFile specifica il percorso della chiave privata SSL
    # Questa chiave privata viene utilizzata per decrittografare i dati ricevuti
    # Deve essere mantenuta segreta e protetta con permessi di file appropriati (600)
    SSLCertificateKeyFile /etc/ssl/private/local-desk.services.siag.it.key
    
    # Configurazione Reverse Proxy per API verso backend esterno
    # Il reverse proxy permette al frontend di comunicare con API esterne aggirando le restrizioni CORS
    # e centralizzando la gestione delle richieste API attraverso lo stesso dominio
    
    # ProxyPreserveHost mantiene l'header Host originale nelle richieste proxate
    # Questo è essenziale per applicazioni che dipendono dall'header Host per il routing
    # o la validazione delle richieste (es. controlli CSRF, validazione dominio)
    ProxyPreserveHost On
    
    # RequestHeader aggiunge l'header X-Forwarded-Proto per indicare il protocollo originale
    # Il backend può utilizzare questo header per sapere se la richiesta originale era HTTPS
    # Importante per la generazione corretta di URL assoluti e per controlli di sicurezza
    RequestHeader set X-Forwarded-Proto "https"
    
 
    # Header di sicurezza identici all'ambiente di produzione
    # Questi header proteggono l'applicazione da vari tipi di attacchi web
    
    # X-Frame-Options previene attacchi di clickjacking
    # SAMEORIGIN permette il framing solo da pagine dello stesso dominio
    # Impedisce che la pagina sia incorporata in iframe da domini esterni malintenzionati
    Header always set X-Frame-Options "SAMEORIGIN"
    
    # X-Content-Type-Options previene attacchi MIME-type sniffing
    # nosniff impedisce al browser di "indovinare" il tipo di contenuto
    # Forza il browser a rispettare il Content-Type dichiarato dal server
    # Previene l'esecuzione di script dannosi mascherati come altri tipi di file
    Header always set X-Content-Type-Options "nosniff"
    
    # X-XSS-Protection attiva la protezione XSS integrata del browser
    # "1; mode=block" abilita il filtro e blocca completamente la pagina se rileva XSS
    # Fornisce una protezione aggiuntiva contro attacchi Cross-Site Scripting
    Header always set X-XSS-Protection "1; mode=block"
    
    # Referrer-Policy controlla quali informazioni di referrer vengono inviate
    # "strict-origin-when-cross-origin" invia il referrer completo solo per richieste same-origin
    # Per richieste cross-origin invia solo l'origine, migliorando la privacy degli utenti
    Header always set Referrer-Policy "strict-origin-when-cross-origin"
    
    # Strict-Transport-Security (HSTS) forza l'uso di HTTPS
    # max-age=31536000 (1 anno) specifica per quanto tempo il browser deve ricordare questa policy
    # includeSubDomains estende la policy a tutti i sottodomini
    # Previene attacchi man-in-the-middle e downgrade attacks
    Header always set Strict-Transport-Security "max-age=31536000; includeSubDomains"
    
    # Configurazione della directory per l'applicazione Angular
    # Definisce i permessi e le regole di accesso per la cartella contenente i file dell'app
    <Directory /var/www/hr-seats-angular/seat-management/browser>
        # AllowOverride None disabilita l'uso di file .htaccess nella directory
        # Impedisce la sovrascrittura delle direttive Apache tramite file di configurazione locali
        # Migliora le performance evitando la ricerca di file .htaccess ad ogni richiesta
        # Aumenta la sicurezza centralizzando tutta la configurazione nel file principale
        AllowOverride None
        
        # Require all granted concede l'accesso a tutti gli utenti
        # Sostituisce la vecchia sintassi "Allow from all" di Apache 2.2
        # Permette l'accesso pubblico ai file statici dell'applicazione web.
        # Non so se le richieste statiche vengono di solito gestite cosi, basta fare come 
        # fanno in RUN 
        Require all granted
        
        # Options controlla le funzionalità disponibili per questa directory
        # -Indexes disabilita la generazione automatica di indici di directory per sicurezza
        # +FollowSymLinks permette di seguire i link simbolici, utile per build ottimizzate
        Options -Indexes +FollowSymLinks
        
        # DirectoryIndex specifica il file da servire quando viene richiesta una directory
        # index.html è il file principale generato da Angular build
        # Assicura che le richieste alla root servano automaticamente l'applicazione Angular
        DirectoryIndex index.html
        
        # Supporto per il routing di Angular (Single Page Application)
        # Necessario per gestire le route client-side di Angular
        
        # Attiva il motore di riscrittura URL per gestire le route di Angular
        RewriteEngine On
        
        # RewriteCond %{REQUEST_FILENAME} !-f: applica la regola solo se il file richiesto NON esiste
        # Evita di reindirizzare richieste per file reali (CSS, JS, immagini)
        RewriteCond %{REQUEST_FILENAME} !-f
        
        # RewriteCond %{REQUEST_FILENAME} !-d: applica la regola solo se la directory richiesta NON esiste
        # Evita di reindirizzare richieste per directory reali
        RewriteCond %{REQUEST_FILENAME} !-d
        
        # RewriteCond %{REQUEST_URI} !^/assets/: esclude la cartella assets dal reindirizzamento
        # I file statici (immagini, font, etc.) devono essere serviti direttamente da Apache
        RewriteCond %{REQUEST_URI} !^/assets/
        
        # RewriteRule reindirizza tutte le altre richieste a index.html
        # Permette ad Angular Router di gestire le route client-side
        # [L] indica che questa è l'ultima regola da processare per questa richiesta
        RewriteRule ^.*$ /index.html [L]
    </Directory>
    
    # Controllo della cache per ottimizzare le performance
    # Configurazione differenziata basata sul tipo di file per bilanciare performance e aggiornamenti
    
    # Cache aggressiva per file statici che raramente cambiano
    # Applica la cache a file CSS, JavaScript, immagini e font
    <FilesMatch "\.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$">
        # public: permette la cache anche ai proxy intermedi (CDN, proxy aziendali)
        # max-age=31536000: cache valida per 1 anno (365 giorni)
        # immutable: indica che il file non cambierà mai durante il periodo di cache
        # Migliora significativamente le performance riducendo le richieste HTTP
        Header set Cache-Control "public, max-age=31536000, immutable"
    </FilesMatch>
    
    # Cache disabilitata per file che devono essere sempre aggiornati
    # Applica a index.html e file JavaScript principali che possono contenere riferimenti a nuove versioni
    <FilesMatch "(index\.html|main\..+\.js)$">
        # no-cache: forza la validazione con il server prima di usare la cache
        # no-store: impedisce completamente il salvataggio in cache
        # must-revalidate: forza la rivalidazione quando la cache scade
        # Assicura che gli utenti ricevano sempre la versione più recente dell'applicazione
        Header set Cache-Control "no-cache, no-store, must-revalidate"
    </FilesMatch>
    
    # Configurazione dei log per monitoraggio e debugging
    # I log sono essenziali per diagnosticare problemi e monitorare l'utilizzo dell'applicazione
    
    # ErrorLog registra tutti gli errori di Apache per questo VirtualHost
    # Utilizza una variabile d'ambiente per il percorso standard dei log di Apache
    # Il nome del file include il progetto per facilitare l'identificazione
    ErrorLog ${APACHE_LOG_DIR}/hr-seats-angular-prod-sim-error.log
    
    # CustomLog registra tutte le richieste HTTP con formato "combined"
    # Il formato "combined" include: IP, timestamp, richiesta, status, dimensione, referrer, user-agent
    # Fornisce informazioni dettagliate per analisi del traffico e debugging
    CustomLog ${APACHE_LOG_DIR}/hr-seats-angular-prod-sim-access.log combined
</VirtualHost>

# Listen 8443 configura Apache per ascoltare sulla porta 8443
# Questa porta è utilizzata per il VirtualHost HTTPS di simulazione produzione
# Separata dalla porta standard 443 per evitare conflitti con altri servizi
# Permette di testare l'applicazione in modalità produzione senza interferire con altri siti
Listen 8443