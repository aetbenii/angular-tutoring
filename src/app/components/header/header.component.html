<mat-toolbar color="primary">
  <div class="brand">
    <app-logo [size]="180"></app-logo>
    <span class="brand-text">Office Management</span>
  </div>
  
  <!-- Authentication section -->
  <div class="spacer"></div>
  <div class="auth-section">
    @if (isAuthenticated) {
      <!-- Debug button - preserve existing functionality -->
      @if (!environment.production) {
        <button mat-icon-button 
                routerLink="/debug"
                matTooltip="Debug Panel"
                class="debug-btn">
          <mat-icon>bug_report</mat-icon>
        </button>
      }
      
      <span class="user-info">
        Welcome, {{ displayName }}
        @if (isAdmin) {
          <mat-icon class="admin-icon">admin_panel_settings</mat-icon>
        }
      </span>
      <button mat-raised-button color="warn" (click)="logout()" class="logout-btn">
        <mat-icon>logout</mat-icon>
        Logout
      </button>
    }
  </div>
</mat-toolbar>

<nav mat-tab-nav-bar [tabPanel]="tabPanel" backgroundColor="primary">
  @for (link of navLinks; track link.path) {
    <a mat-tab-link
       [routerLink]="link.path"
       routerLinkActive #rla="routerLinkActive"
       [active]="rla.isActive"
       [routerLinkActiveOptions]="{exact: false}">
      {{link.label}}
    </a>
  }
</nav>
<mat-tab-nav-panel #tabPanel></mat-tab-nav-panel>
