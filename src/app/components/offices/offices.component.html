<div class="offices-container">
  <h1>Offices</h1>

  <mat-card class="floor-selector">
    @if (reservingForEmployee) {
      <div class="reservation-context">
        <mat-icon>person</mat-icon>
        <span>Reserving seat for: {{reservingForEmployee.name}}</span>
      </div>
    }

    <mat-form-field>
      <mat-label>Select Floor</mat-label>
      <mat-select [formControl]="selectedFloorControl">
        @for (floor of floors(); track floor.id) {
          <mat-option [value]="floor.floorNumber">
            {{floor.name}}
          </mat-option>
        }
      </mat-select>
      <mat-icon matSuffix>apartment</mat-icon>
    </mat-form-field>
  </mat-card>

  <div class="floor-content">
    @if (loading) {
      <div class="loading-container">
        <mat-spinner diameter="40"></mat-spinner>
      </div>
    }

    @if (error) {
      <div class="error-message">
        <mat-icon>error</mat-icon>
        <p>{{error}}</p>
      </div>
    }

    @if (!loading && !error && selectedFloorControl.value !== null) {
      <app-room-grid
        [floorNumber]="selectedFloorControl.value"
        (seatSelected)="onSeatSelected($event)"
      ></app-room-grid>
    }
  </div>
</div>
