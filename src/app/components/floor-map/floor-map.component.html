<div class="floor-map-container">
  <h1>Floor Maps</h1>

  <mat-card class="floor-selector">
    <mat-form-field>
      <mat-label>Select Floor</mat-label>
      <mat-select [formControl]="selectedFloorControl">
        <mat-option *ngFor="let floor of floors()" [value]="floor.floorNumber">
          {{floor.name}}
        </mat-option>
      </mat-select>
      <mat-icon matSuffix>apartment</mat-icon>
    </mat-form-field>
    <mat-form-field>
      <mat-label>Search by name or occupation</mat-label>
      <input matInput
        #searchInput
        [formControl]="searchControl"
        [matAutocomplete]="auto"
        placeholder="Type to search...">
      <mat-icon matSuffix>search</mat-icon>
      <mat-autocomplete 
        #auto="matAutocomplete" 
        [displayWith]="displayFn" 
        (optionSelected)="onEmployeeSelected($event)">
        <mat-option *ngFor="let option of filteredNames | async" 
        [value]="option">
          {{option.fullName}} <span *ngIf="option.floorName">- {{option.floorName}}</span>
        </mat-option>
      </mat-autocomplete>
    </mat-form-field>
  </mat-card>
  <div class="canvas-container" #canvasContainer>
    <!-- Loading spinner -->
    <div *ngIf="loading()" class="loading-container">
      <mat-spinner diameter="50"></mat-spinner>
      <p>Loading floor plan...</p>
    </div>
    
    <!-- SVG not available message -->
    <div *ngIf="svgNotAvailable() && !loading()" class="no-plan-container">
      <mat-icon class="no-plan-icon">error_outline</mat-icon>
      <h3>Floor Plan Not Available</h3>
      <p>The floor plan for this floor is currently not available.</p>
    </div>
  </div>
</div>
