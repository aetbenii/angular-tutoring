<div class="room-grid">
  @if (selectedFloor()) {
    <h2>{{ selectedFloor()?.name }}</h2>
    <div class="rooms">
      @for (room of selectedFloor()?.rooms; track room.id) {
        <mat-card class="room">
          <mat-card-content>
            <div class="room-content">
              <div class="room-header">
                <div class="room-info">
                  <h3>{{ room.name }}</h3>
                  <p class="room-number">Room {{ room.roomNumber }}</p>
                </div>
                <button mat-raised-button color="primary" 
                        [routerLink]="['/edit-map', floorNumber, room.id]"
                        class="edit-geometry-btn">
                  <mat-icon>edit</mat-icon>
                  Edit Geometry
                </button>
              </div>
              <div class="seats">
                @for (seat of room.seats; track seat.id) {
                  <button 
                    class="seat" 
                    [class.occupied]="seat.occupied"
                    (click)="onSeatClick(room.id, seat.id)"
                    [attr.aria-label]="'Seat ' + seat.seatNumber + (seat.occupied ? ' (occupied)' : ' (available)')"
                    type="button">
                    {{ seat.seatNumber }}
                  </button>
                }
              </div>
            </div>
          </mat-card-content>
        </mat-card>
      }
    </div>
  } @else {
    <p class="no-selection">Please select a floor</p>
  }
</div>
