parameters:
  - name: environment
    type: string
    values:
      - development
      - test
      - production
  - name: archiveName
    type: string
    default: ''

steps:
  - script: |
      set -e
      echo "📝 Generating build info for ${{ parameters.environment }}..."
      
      # Debug: Show current package version and build variables
      echo "Current package.json version: $(cat package.json | grep '"version"' | head -1)"
      echo "Build variables:"
      echo "  - tagVersion: $(tagVersion)"
      echo "  - cleanVersion: $(cleanVersion)"
      echo "  - isTag: $(isTag)"
      echo "  - Build.SourceBranch: $(Build.SourceBranch)"
      echo "  - Build.SourceVersion: $(Build.SourceVersion)"
      
      # Ensure git tags are available for accurate tagging info
      git fetch --tags --force || true
      
      node scripts/generate-build-info.js ${{ parameters.environment }}
      
      echo "🔨 Building Angular app for ${{ parameters.environment }}..."
      npx ng build --configuration ${{ parameters.environment }}
      
      echo "📁 Checking dist directory..."
      ls -la dist/ || echo "dist directory not found"
      
      if [ -n "${{ parameters.archiveName }}" ]; then
        echo "📦 Creating archive ${{ parameters.archiveName }}..."
        cd dist/seat-management/browser
        tar czf ../../../${{ parameters.archiveName }} *
        cd ../../..
      fi
    displayName: '🔨 Build ${{ parameters.environment }} bundle'
    env:
      BUILD_BUILDNUMBER: $(Build.BuildNumber)
      BUILD_SOURCEBRANCHNAME: $(Build.SourceBranchName)
      BUILD_SOURCEBRANCH: $(Build.SourceBranch)
      BUILD_SOURCEVERSION: $(Build.SourceVersion)
      BUILD_REASON: $(Build.Reason)
      cleanVersion: $(cleanVersion)
      AGENT_NAME: $(Agent.Name)
      TF_BUILD: $(TF_BUILD)
      CI: true
      # Pass version information explicitly
      # cleanVersion is set for tag builds, packageVersion for branch builds
      BUILD_VERSION: $[ coalesce(variables['cleanVersion'], variables['packageVersion'], '') ]
      BUILD_TAG: $(tagVersion)